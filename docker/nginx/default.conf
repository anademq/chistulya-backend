resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;

client_header_timeout 15s;
client_body_timeout   30s;
send_timeout          30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── Default server: refuse anything with an unrecognised Host ────────────────
server {
    listen      80 default_server;
    listen      443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/privkey.pem;

    # Container healthcheck. Restricted to the loopback address so it is not a
    # public endpoint, and matched before the catch-all below.
    location = /nginx-health {
        allow 127.0.0.1;
        deny  all;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 444 closes the connection without sending a response.
    location / {
        return 444;
    }
}

# ── HTTP: storage subdomain → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name storage.чистуля.рф storage.xn--h1agrefu5d.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: storage.чистуля.рф → MinIO S3 API ────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name storage.чистуля.рф storage.xn--h1agrefu5d.xn--p1ai;

    ssl_certificate         /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;

    client_max_body_size 100M;

    access_log /dev/stdout;
    error_log  /dev/stderr error;

    # The console is disabled via MINIO_BROWSER=off, but never expose the admin
    # surface even if someone flips it back on.
    location ~ ^/minio/admin/ {
        return 404;
    }

    location / {
        limit_req zone=upload burst=20 nodelay;

        set $upstream_minio minio:9000;
        proxy_pass              http://$upstream_minio;
        # MinIO validates the request signature against the Host it receives, so
        # this must stay the internal name — $http_host breaks the signature.
        proxy_set_header        Host              minio:9000;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   30s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}

# ── HTTP: API — certbot challenge + redirect to HTTPS ───────────────────────
server {
    listen 80;
    server_name api.чистуля.рф api.xn--h1agrefu5d.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: API ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name api.чистуля.рф api.xn--h1agrefu5d.xn--p1ai;

    ssl_certificate         /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/xn--h1agrefu5d.xn--p1ai/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size        25M;
    large_client_header_buffers 4 32k;
    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr error;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json application/graphql+json text/plain application/javascript text/css;

    # php-fpm answers its own ping/status paths before PHP ever runs, because
    # nginx forwards SCRIPT_NAME. fpm-status leaks pool internals, so both are
    # cut off here. The container healthcheck talks to the socket directly and
    # never passes through nginx.
    location ~ ^/(ping|fpm-status)$ {
        return 404;
    }

    # ── Reverb WebSocket ────────────────────────────────────────────────────
    # Handles WebSocket connections (/broadcasting/app/{key}) and the Pusher
    # HTTP API (/broadcasting/apps/{id}). The prefix is stripped before proxying.
    # /broadcasting/auth is NOT matched here — it goes to PHP below.
    location ~ ^/broadcasting/apps?/ {
        rewrite ^/broadcasting(/.*)$ $1 break;

        set $upstream_reverb reverb:8080;
        proxy_pass         http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Application (pure API — every request routed through Laravel) ────────
    location / {
        limit_req zone=api burst=60 nodelay;

        set $upstream_app app:9000;
        fastcgi_pass            $upstream_app;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param           HTTPS on;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
