; Overrides the stock www pool. Installed as zzz-app.conf so it is parsed after
; both www.conf and the image own zz-docker.conf, which also declares [www].
; Sizing assumes a single small VPS shared with postgres, redis and minio.

[www]
user  = www-data
group = www-data

listen       = 9000
listen.owner = www-data
listen.group = www-data

; Each idle child holds roughly 40–60 MB with OPcache warm, so 20 children is
; about 1 GB of worst-case resident memory. Lower this before anything else if
; the box starts swapping.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; Recycle workers periodically so a slow leak in a long-lived request cannot
; accumulate for the lifetime of the container.
pm.max_requests = 500

; Answers the container healthcheck. Reachable only from inside the network —
; nginx never proxies these paths.
ping.path     = /ping
ping.response = pong
pm.status_path = /fpm-status

; Worker output goes to the container log rather than a file nobody reads.
catch_workers_output       = yes
decorate_workers_output    = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; A request stuck past this is logged with a PHP backtrace instead of dying
; silently. Kept just under nginx's fastcgi_read_timeout.
request_terminate_timeout = 60s
request_slowlog_timeout   = 15s
slowlog                   = /proc/self/fd/2
